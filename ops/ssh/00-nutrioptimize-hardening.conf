# NutriOptimize host SSH policy.
# Keep key authentication, disable password/root login, and reduce features
# that are not needed on this server.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitEmptyPasswords no
X11Forwarding no
AllowAgentForwarding no
MaxAuthTries 3
LoginGraceTime 30

# Optionally restrict SSH to the administrative account used on this host.
# Replace ADMIN_USER before uncommenting; an invalid name can lock you out.
# AllowUsers ADMIN_USER
